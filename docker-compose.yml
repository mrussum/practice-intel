services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: career
      POSTGRES_DB: career
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    # Optional: without a .env the app runs in demo mode (deterministic fake AI).
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://career:career@db:5432/career
      WEB_ORIGIN: http://localhost:8080,http://localhost:5173
    ports: ["3001:3001"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { VITE_API_URL: http://localhost:3001 }
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

  # Loads the fictional fixtures: docker compose --profile seed run --rm seed
  seed:
    profiles: [seed]
    image: curlimages/curl:8.10.1
    volumes:
      - ./scripts:/scripts:ro
      - ./evals/fixtures:/fixtures:ro
    environment:
      API_URL: http://api:3001
      FIXTURES_DIR: /fixtures
    entrypoint: ["sh", "/scripts/seed.sh"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  dbdata:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Includes the Postgres integration test (testcontainers uses the runner's Docker).
      - run: pnpm test
      - run: pnpm build

  # Dependency audit. Gates on high/critical advisories in production
  # dependencies (what ships in the images); dev-tool advisories are reported
  # in the log without failing the build, and Dependabot proposes upgrades.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No `cache: pnpm` here: this job never installs, so the post-job cache
      # save finds no store and fails the job.
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm audit --prod --audit-level high
      - name: Report dev-dependency advisories (non-blocking)
        run: pnpm audit || true

  # Golden-set evals in fake mode: deterministic, no API keys, no cost.
  # Gates on routing, retrieval filtering, citation groundedness and refusals.
  # Real-model runs are manual: `pnpm eval --real --judge` with keys set.
  evals:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: eval-report
          path: evals/report.md

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @career-intel/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
